<!doctype html>
<html lang="__LANG__" dir="__DIR__">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VaultX Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { cairo: ["Cairo", "sans-serif"] },
          colors: {
            vxbg: "#05070d",
            vxcard: "rgba(16,22,34,.62)",
            vxline: "rgba(107,140,199,.32)",
            vxtxt: "#eaf2ff",
            vxmuted: "#9aa8c5",
            vxblue: "#4ea3ff",
            vxgold: "#f4c96a"
          },
          boxShadow: {
            glow: "0 0 0 3px rgba(78,163,255,.25)",
            card: "0 20px 60px rgba(0,0,0,.45)"
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background:
        radial-gradient(circle at 12% 0%, rgba(32, 68, 120, .55), transparent 35%),
        radial-gradient(circle at 87% 100%, rgba(55, 30, 85, .5), transparent 38%),
        #05070d;
    }
    .glass {
      background: rgba(16,22,34,.62);
      border: 1px solid rgba(107,140,199,.32);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .fade-in { animation: fadeIn .25s ease; }
    .slide-up { animation: slideUp .30s cubic-bezier(.2,.8,.2,1); }
    @keyframes fadeIn { from {opacity:.2} to {opacity:1} }
    @keyframes slideUp { from {opacity:.1; transform: translateY(10px)} to {opacity:1; transform: translateY(0)} }
    .loader { width:18px;height:18px;border-radius:999px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg);} }
  </style>
</head>
<body class="font-cairo text-vxtxt min-h-screen">
  <div id="app" class="max-w-md mx-auto px-3 py-3 pb-24"></div>

  <script>
    const BOOT = __BOOTSTRAP_JSON__;
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); tg.MainButton.hide(); }

    const isAr = BOOT.lang === "ar";
    const t = {
      appTitle: "VaultX Pro",
      wallet: isAr ? "الرصيد" : "Balance",
      level: isAr ? "المستوى" : "Level",
      operations: isAr ? "عمليّاتي" : "My Operations",
      openInTelegram: isAr ? "هذه الوظيفة تعمل داخل تيليجرام" : "This action works inside Telegram",
      loading: isAr ? "جاري التحميل..." : "Loading...",
      processing: isAr ? "جارٍ التنفيذ..." : "Processing...",
      paymentCenter: isAr ? "شحن الحساب" : "Top Up",
      serviceHub: isAr ? "الخدمة" : "Service",
      back: isAr ? "رجوع" : "Back",
      copy: isAr ? "نسخ" : "Copy",
      copied: isAr ? "تم النسخ" : "Copied",
      txid: isAr ? "رقم العملية" : "Transaction ID",
      amount: isAr ? "المبلغ" : "Amount",
      payConfirm: isAr ? "تأكيد الدفع" : "Confirm Payment",
      converter: isAr ? "الرصيد المتوقع" : "Expected Credit",
      emptyOps: isAr ? "لا توجد عمليات بعد" : "No operations yet",
      digital_numbers: isAr ? "الأرقام الوهمية" : "Virtual Numbers",
      social_boost: isAr ? "رشق الحسابات" : "SMM Boost",
      game_topup: isAr ? "شحن الألعاب" : "Game Top-up",
      pro_accounts: isAr ? "حسابات Pro" : "Pro Accounts",
      social_accounts: isAr ? "حسابات سوشيال" : "Social Accounts",
      cloud_services: isAr ? "الخدمات السحابية" : "Cloud Services",
      temporary_emails: isAr ? "إيميلات مؤقتة" : "Temporary Emails",
      virtual_visa: isAr ? "فيزا افتراضية" : "Virtual Visa",
      other_services: isAr ? "خدمات أخرى" : "Other Services",
      account: isAr ? "حسابي" : "My Account",
      referral: isAr ? "الإحالة" : "Referral",
      settings: isAr ? "الإعدادات" : "Settings"
    };

    const state = {
      view: BOOT.initialScreen === "payment" ? "payments" : "dashboard",
      selectedMethod: BOOT.initialMethod || (BOOT.methods[0] ? BOOT.methods[0].key : "binance"),
      user: { ...BOOT.user },
      operations: []
    };

    const bigServices = [
      { key: "digital_numbers", icon: "📱", color: "from-blue-500/25 to-cyan-400/10" },
      { key: "social_boost", icon: "🚀", color: "from-violet-500/25 to-fuchsia-400/10" },
      { key: "game_topup", icon: "🎮", color: "from-emerald-500/25 to-lime-400/10" },
      { key: "pro_accounts", icon: "💎", color: "from-amber-500/25 to-yellow-400/10" },
      { key: "social_accounts", icon: "👥", color: "from-pink-500/25 to-rose-400/10" },
      { key: "cloud_services", icon: "☁️", color: "from-indigo-500/25 to-sky-400/10" },
      { key: "temporary_emails", icon: "📧", color: "from-cyan-500/25 to-blue-400/10" },
      { key: "virtual_visa", icon: "💳", color: "from-slate-500/25 to-zinc-400/10" },
      { key: "other_services", icon: "🧩", color: "from-purple-500/25 to-indigo-400/10" },
      { key: "payments", icon: "💰", color: "from-teal-500/25 to-cyan-400/10" }
    ];

    const topActions = [
      { key: "account", icon: "👤" },
      { key: "referral", icon: "🎁" },
      { key: "operations", icon: "🧾" },
      { key: "settings", icon: "⚙️" }
    ];

    function escapeHtml(v) {
      return String(v || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function moneyRub(v) {
      const n = Number(v || 0);
      return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function calcRub(method, amount) {
      const m = BOOT.methods.find(function(x){ return x.key === method; });
      const val = Number(String(amount || "").replace(",", "."));
      if (!Number.isFinite(val) || val <= 0 || !m) return 0;
      if (method === "binance") return val * (m.rub_per_unit || 30);
      const p = Number(m.local_per_rub || 0);
      if (!p) return 0;
      return val / p;
    }

    function getTelegramUserId() {
      return Number(tg?.initDataUnsafe?.user?.id || state.user.id || 0);
    }

    async function refreshProfile() {
      const uid = getTelegramUserId();
      if (!uid) return;
      try {
        const res = await fetch(`/webapp/profile?user_id=${uid}`, { cache: "no-store" });
        const data = await res.json();
        if (data?.ok && data.profile) {
          state.user = { ...state.user, ...data.profile };
          if (state.view === "dashboard") render();
        }
      } catch (_) {}
    }

    async function loadOperations() {
      const uid = getTelegramUserId();
      if (!uid) return;
      try {
        const res = await fetch(`/webapp/transactions?user_id=${uid}&limit=20`, { cache: "no-store" });
        const data = await res.json();
        state.operations = Array.isArray(data?.transactions) ? data.transactions : [];
      } catch (_) {
        state.operations = [];
      }
    }

    function sendAction(action, details) {
      const payload = {
        type: "vaultx_webapp_request",
        action,
        details,
        user_id: getTelegramUserId(),
        ts: Date.now()
      };
      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(payload));
        return true;
      }
      return false;
    }

    function sendGateway(method, amountLocal, txId) {
      const payload = {
        type: "gateway_topup",
        method,
        amount_local: Number(amountLocal),
        tx_id: String(txId || "").trim(),
        user_id: getTelegramUserId()
      };
      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(payload));
        return true;
      }
      return false;
    }

    function showToast(text, ok) {
      const toast = document.createElement("div");
      toast.className = "fixed left-1/2 -translate-x-1/2 bottom-4 px-4 py-2 rounded-xl border z-50 text-sm " + (ok ? "bg-emerald-500/20 border-emerald-400/40" : "bg-rose-500/20 border-rose-400/40");
      toast.textContent = text;
      document.body.appendChild(toast);
      setTimeout(function(){ toast.remove(); }, 1600);
    }

    function renderTopBar() {
      const actions = topActions.map(function(a){
        return '<button data-top="' + a.key + '" class="glass rounded-xl px-3 py-2 text-xs font-semibold">' + a.icon + ' ' + (a.key === 'operations' ? t.operations : t[a.key]) + '</button>';
      }).join("");
      return '<header class="glass rounded-2xl p-3 shadow-card fade-in">' +
        '<div class="flex items-center justify-between">' +
          '<div>' +
            '<div class="text-sm font-extrabold tracking-wide">' + t.appTitle + '</div>' +
            '<div class="text-[11px] text-vxmuted">@' + escapeHtml(state.user.username || "vaultx_user") + '</div>' +
          '</div>' +
          '<div class="text-[11px] px-2 py-1 rounded-lg border border-vxline bg-white/5">ID: ' + (state.user.id || 0) + '</div>' +
        '</div>' +
        '<div class="grid grid-cols-2 gap-2 mt-3">' +
          '<div class="glass rounded-xl p-2"><div class="text-vxmuted text-[11px]">' + t.wallet + '</div><div class="font-bold text-sm">' + moneyRub(state.user.balanceRub) + ' RUB</div></div>' +
          '<div class="glass rounded-xl p-2"><div class="text-vxmuted text-[11px]">' + t.level + '</div><div class="font-bold text-sm">' + escapeHtml(state.user.level || "Newbie") + '</div></div>' +
        '</div>' +
        '<div class="grid grid-cols-4 gap-2 mt-3">' + actions + '</div>' +
      '</header>';
    }

    function renderDashboard() {
      const cards = bigServices.map(function(s){
        return '<button data-service="' + s.key + '" class="glass rounded-2xl p-4 text-start shadow-card bg-gradient-to-br ' + s.color + ' border border-vxline hover:border-vxblue/40 transition slide-up">' +
          '<div class="text-2xl">' + s.icon + '</div>' +
          '<div class="text-sm mt-1 font-bold">' + t[s.key] + '</div>' +
          '<div class="text-[11px] text-vxmuted mt-0.5">' + (s.key === "payments" ? t.paymentCenter : t.serviceHub) + '</div>' +
        '</button>';
      }).join("");
      return '<section class="mt-3 grid grid-cols-2 gap-2">' + cards + '</section>';
    }

    function renderOperations() {
      const rows = state.operations.length
        ? state.operations.map(function(tx){
            return '<div class="glass rounded-xl p-3 border border-vxline">' +
              '<div class="flex items-center justify-between gap-2">' +
                '<div class="text-xs text-vxmuted">' + escapeHtml(tx.type || tx.serviceKey || "transaction") + '</div>' +
                '<div class="text-xs">' + moneyRub(tx.amount || 0) + ' RUB</div>' +
              '</div>' +
              '<div class="text-[11px] text-vxmuted mt-1">' + escapeHtml(tx.createdAt || "") + '</div>' +
            '</div>';
          }).join("")
        : '<div class="glass rounded-xl p-4 text-sm text-vxmuted">' + t.emptyOps + '</div>';

      return '<section class="mt-3 space-y-2 slide-up">' +
        '<div class="glass rounded-2xl p-3 flex items-center justify-between">' +
          '<div class="font-bold">' + t.operations + '</div>' +
          '<button data-action="go-dashboard" class="text-xs px-2 py-1 rounded-lg border border-vxline bg-white/5">' + t.back + '</button>' +
        '</div>' + rows +
      '</section>';
    }

    function renderPayments() {
      const tabs = BOOT.methods.map(function(m){
        const active = m.key === state.selectedMethod;
        return '<button data-method="' + m.key + '" class="px-3 py-2 rounded-xl border text-xs ' + (active ? 'bg-vxblue text-black border-vxblue' : 'bg-white/5 border-vxline') + '">' + (isAr ? m.title_ar : m.title_en) + '</button>';
      }).join('');

      const m = BOOT.methods.find(function(x){ return x.key === state.selectedMethod; }) || BOOT.methods[0];
      const rateText = state.selectedMethod === 'binance'
        ? ('1 USD = ' + ((m && m.rub_per_unit) || 30) + ' RUB')
        : ('1 RUB = ' + ((m && m.local_per_rub) || 0) + ' ' + ((m && m.local_currency) || ''));

      return '<section class="mt-3 space-y-2 slide-up">' +
        '<div class="glass rounded-2xl p-3 flex items-center justify-between"><div class="font-bold">' + t.paymentCenter + '</div><button data-action="go-dashboard" class="text-xs px-2 py-1 rounded-lg border border-vxline bg-white/5">' + t.back + '</button></div>' +
        '<div class="glass rounded-2xl p-3"><div class="flex flex-wrap gap-2">' + tabs + '</div></div>' +
        '<div class="glass rounded-2xl p-3">' +
          '<div class="text-xs text-vxmuted">' + (isAr ? 'رقم الحساب' : 'Account ID') + '</div>' +
          '<div class="flex items-center gap-2 mt-1"><div id="accId" class="font-bold text-sm flex-1 break-all">' + ((m && m.account_id) || '-') + '</div><button data-action="copy-account" class="px-3 py-2 rounded-xl border border-vxline bg-white/5 text-xs">' + t.copy + '</button></div>' +
          '<div class="text-xs text-vxmuted mt-3">' + t.amount + ' (' + ((m && m.local_currency) || '') + ')</div>' +
          '<input id="payAmount" inputmode="decimal" class="w-full mt-1 rounded-xl bg-black/30 border border-vxline px-3 py-2 text-sm outline-none focus:shadow-glow" placeholder="0.00" />' +
          '<div class="text-xs text-vxmuted mt-3">' + t.txid + '</div>' +
          '<input id="payTx" class="w-full mt-1 rounded-xl bg-black/30 border border-vxline px-3 py-2 text-sm outline-none focus:shadow-glow" placeholder="TX123..." />' +
          '<div id="payConv" class="mt-3 rounded-xl border border-vxline bg-white/5 px-3 py-2 text-sm">' + t.converter + ': 0.00 RUB</div>' +
          '<div class="text-[11px] text-vxmuted mt-1">' + rateText + '</div>' +
          '<button data-action="submit-payment" class="w-full mt-3 rounded-xl bg-gradient-to-r from-vxgold to-amber-300 text-black font-extrabold py-2.5 flex items-center justify-center gap-2"><span>' + t.payConfirm + '</span></button>' +
        '</div>' +
      '</section>';
    }

    function render() {
      const app = document.getElementById("app");
      let html = renderTopBar();
      if (state.view === "dashboard") html += renderDashboard();
      else if (state.view === "payments") html += renderPayments();
      else if (state.view === "operations") html += renderOperations();
      app.innerHTML = html;
      bindEvents();
      refreshPaymentPreview();
    }

    function refreshPaymentPreview() {
      const amountInput = document.getElementById('payAmount');
      const out = document.getElementById('payConv');
      if (!amountInput || !out) return;
      const repaint = function() {
        const x = Number(String(amountInput.value || '').replace(',', '.'));
        const rr = Number.isFinite(x) ? calcRub(state.selectedMethod, x) : 0;
        out.textContent = t.converter + ': ' + rr.toFixed(2) + ' RUB';
      };
      repaint();
      amountInput.oninput = repaint;
    }

    function openServiceFromCard(key) {
      if (key === "payments") {
        state.view = "payments";
        render();
        return;
      }
      if (key === "operations") {
        state.view = "operations";
        render();
        return;
      }
      const ok = sendAction("open_service:" + key, { source: "vaultx_super_app" });
      if (ok) {
        showToast(t.loading, true);
        setTimeout(function(){ if (tg) tg.close(); }, 250);
      } else {
        showToast(t.openInTelegram, false);
      }
    }

    function bindEvents() {
      document.querySelectorAll('[data-service]').forEach(function(btn){
        btn.onclick = function(){ openServiceFromCard(btn.dataset.service); };
      });

      document.querySelectorAll('[data-top]').forEach(function(btn){
        btn.onclick = function(){
          const key = btn.dataset.top;
          if (key === "operations") {
            state.view = "operations";
            render();
            return;
          }
          openServiceFromCard(key);
        };
      });

      document.querySelectorAll('[data-action="go-dashboard"]').forEach(function(btn){
        btn.onclick = function(){ state.view = 'dashboard'; render(); };
      });

      document.querySelectorAll('[data-method]').forEach(function(btn){
        btn.onclick = function(){ state.selectedMethod = btn.dataset.method; state.view = 'payments'; render(); };
      });

      const copyBtn = document.querySelector('[data-action="copy-account"]');
      if (copyBtn) {
        copyBtn.onclick = async function(){
          const text = (document.getElementById('accId') || {}).innerText || '';
          try {
            await navigator.clipboard.writeText(text);
            copyBtn.textContent = t.copied;
            setTimeout(function(){ copyBtn.textContent = t.copy; }, 1000);
          } catch (_) {}
        };
      }

      const submitPay = document.querySelector('[data-action="submit-payment"]');
      if (submitPay) {
        submitPay.onclick = function(){
          const amount = (document.getElementById('payAmount') || {}).value || '';
          const txid = (document.getElementById('payTx') || {}).value || '';
          const n = Number(String(amount).replace(',', '.'));
          if (!Number.isFinite(n) || n <= 0 || !String(txid).trim()) {
            showToast(isAr ? 'تحقق من البيانات' : 'Check required fields', false);
            return;
          }
          submitPay.innerHTML = '<div class="loader"></div><span>' + t.processing + '</span>';
          const ok = sendGateway(state.selectedMethod, n, txid);
          if (!ok) {
            showToast(t.openInTelegram, false);
            submitPay.innerHTML = '<span>' + t.payConfirm + '</span>';
            return;
          }
          setTimeout(async function(){
            await refreshProfile();
            showToast(isAr ? 'تم إرسال بيانات الدفع بنجاح' : 'Payment data submitted', true);
            submitPay.innerHTML = '<span>' + t.payConfirm + '</span>';
          }, 600);
        };
      }
    }

    async function boot() {
      await refreshProfile();
      await loadOperations();
      render();
    }

    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible') refreshProfile();
    });

    boot();
  </script>
</body>
</html>
