services:
  - type: web
    name: vaultx-bot
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: VAULTX_REQUIRE_PERSISTENT_STORAGE
        value: "0"
